name: Build Windows Single Exe

on:
  workflow_dispatch: # 仅保留手动点击运行

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Single-File Executable
        run: |
          go mod tidy
          wails build -clean -ldflags "-s -w -H windowsgui"

      - name: Upload Single Exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarpScoutChain-Windows-x64
          path: build/bin/*.exe
