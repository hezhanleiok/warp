<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>WarpScout Chain</title>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0f19; color: #e2e8f0; padding: 20px; user-select: none; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 16px; }
    .title { font-size: 18px; font-weight: 700; color: #38bdf8; }
    .section { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
    label { font-size: 13px; color: #94a3b8; margin-bottom: 8px; display: block; font-weight: 500; }
    .radio-group { display: flex; gap: 16px; font-size: 13px; }
    .btn-main { width: 100%; background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .btn-main:hover { background: #1d4ed8; }
    
    /* 实时日志窗口 */
    .log-box {
      background: #030712;
      border: 1px solid #1f2937;
      border-radius: 6px;
      padding: 10px;
      height: 120px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
      color: #10b981;
      margin-top: 12px;
      white-space: pre-wrap;
    }
    
    .output-box { margin-top: 12px; display: none; }
    .export-btns { display: flex; gap: 8px; margin-top: 10px; }
    .btn-export { flex: 1; background: #1f2937; border: 1px solid #374151; color: #f3f4f6; padding: 8px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .btn-export:hover { background: #374151; color: #38bdf8; }
    .sub-input { width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 6px; padding: 6px 10px; color: #38bdf8; font-family: monospace; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">WarpScout Chain v1.0</div>
    <span style="font-size: 12px; color: #64748b;">双层 WARP-on-WARP 解锁器</span>
  </div>

  <div class="section">
    <label>[1] 传输协议 (Outer Protocol)</label>
    <div class="radio-group">
      <label><input type="radio" name="proto" value="awg" checked> AWG (AmneziaWG - 推荐)</label>
      <label><input type="radio" name="proto" value="h2"> MASQUE (H2)</label>
    </div>
  </div>

  <div class="section">
    <label>[2] 出口模式</label>
    <div style="font-size: 13px; color: #34d399;">🔒 纯净海外出口 (解锁 ChatGPT / Claude / Gemini)</div>
  </div>

  <button class="btn-main" onclick="startRun()">🚀 一 键 生 成 链 式 配 置</button>

  <!-- 实时运行日志 -->
  <div class="log-box" id="logWindow">[系统就绪] 等待点击开始...</div>

  <div class="output-box" id="outputBox">
    <label>本地订阅链接 (Sing-box 格式):</label>
    <input type="text" id="subUrl" class="sub-input" readonly value="http://127.0.0.1:8888/sub">
    
    <label style="margin-top: 10px;">点击直接下载对应客户端配置文件：</label>
    <div class="export-btns">
      <button class="btn-export" onclick="downloadFile('warp-awg.conf', awgData)">📁 导出 AWG 配置 (.conf)</button>
      <button class="btn-export" onclick="downloadFile('warp-clash.yaml', yamlData)">📁 导出 Clash 配置 (.yaml)</button>
      <button class="btn-export" onclick="downloadFile('warp-singbox.json', jsonData)">📁 导出 Sing-box (.json)</button>
    </div>
  </div>

  <script>
    let awgData = "", yamlData = "", jsonData = "";

    function appendLog(msg) {
      const box = document.getElementById('logWindow');
      box.innerText += "\n" + msg;
      box.scrollTop = box.scrollHeight;
    }

    // 监听 Go 后端实时推送的日志
    if (window.runtime) {
      window.runtime.EventsOn("log", function(data) {
        appendLog(data);
      });
    }

    async function startRun() {
      document.getElementById('outputBox').style.display = 'none';
      document.getElementById('logWindow').innerText = "[任务启动] 开始执行...";

      try {
        const proto = document.querySelector('input[name="proto"]:checked').value;
        const res = await window.go.main.App.GenerateAllConfigs(proto, 10);
        
        awgData = res.awgConf;
        yamlData = res.clashYaml;
        jsonData = res.singbox;

        document.getElementById('subUrl').value = res.subUrl;
        document.getElementById('outputBox').style.display = 'block';
      } catch (err) {
        appendLog("[错误] " + err);
      }
    }

    function downloadFile(filename, content) {
      if (!content) return;
      const blob = new Blob([content], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
    }
  </script>
</body>
</html>
