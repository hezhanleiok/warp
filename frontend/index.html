<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WarpScout Chain</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background: #0b0f19;
      color: #e2e8f0;
      padding: 24px;
      user-select: none;
      -webkit-user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 20px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .badge {
      font-size: 11px;
      background: #1e3a8a;
      color: #93c5fd;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .lang-toggle {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .section {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .radio-group {
      display: flex;
      gap: 20px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 13px;
      color: #f3f4f6;
    }
    input[type="radio"] {
      accent-color: #38bdf8;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .text-input {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 8px 12px;
      color: #f9fafb;
      font-size: 13px;
      width: 120px;
    }
    .text-input:focus {
      outline: 1px solid #38bdf8;
    }
    .disabled-pill {
      background: #1e293b;
      border: 1px solid #334155;
      color: #34d399;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
      margin-top: 4px;
    }
    .btn-main:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.45);
    }
    .btn-main:active {
      transform: scale(0.99);
    }
    .progress-box {
      margin-top: 16px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 12px 16px;
      display: none;
    }
    .status-text {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: #1f2937;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #2563eb);
      transition: width 0.3s ease;
    }
    .output-section {
      margin-top: 16px;
      display: none;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 14px 16px;
    }
    .sub-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .sub-input {
      flex: 1;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 8px 12px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 13px;
    }
    .btn-action {
      background: #1f2937;
      color: #f3f4f6;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: #374151;
    }
    .btn-action.highlight {
      background: #0284c7;
      border-color: #0284c7;
      color: #fff;
    }
    .btn-action.highlight:hover {
      background: #0369a1;
    }
    .export-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <span class="title">WarpScout Chain</span>
      <span class="badge">v1.0.0</span>
    </div>
    <button class="lang-toggle" onclick="toggleLang()">中文 / English</button>
  </div>

  <div class="section">
    <div class="section-title">[1] 传输协议 (Outer Protocol)</div>
    <div class="radio-group">
      <label><input type="radio" name="proto" value="awg" checked> AWG (AmneziaWG - 推荐)</label>
      <label><input type="radio" name="proto" value="h2"> MASQUE (H2 / TCP 443)</label>
      <label><input type="radio" name="proto" value="h3"> MASQUE (H3 / QUIC)</label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">[2] 生成端点数量 (Endpoint Count)</div>
    <div class="input-row">
      <input type="number" id="epCount" class="text-input" value="10" min="1" max="50">
      <span style="font-size: 12px; color: #64748b;">个优选低延迟 IP 端点</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">[3] 出口地区 (Exit Location)</div>
    <div class="disabled-pill">
      🔒 自动分配海外纯净出口 (解锁 OpenAI, Claude, Gemini)
    </div>
  </div>

  <button class="btn-main" onclick="onGenerate()">🚀 一 键 生 成 链 式 配 置</button>

  <div class="progress-box" id="progressBox">
    <div class="status-text">
      <span id="statusLabel">正在探测本地边缘端点...</span>
      <span id="percentLabel">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <div class="output-section" id="outputSection">
    <div class="section-title" style="color: #38bdf8;">本地订阅服务已启动 (Local Subscription)</div>
    <div class="sub-row">
      <input type="text" id="subUrl" class="sub-input" readonly value="http://127.0.0.1:8888/sub">
      <button class="btn-action highlight" onclick="copySub()">复制订阅链接</button>
    </div>

    <div class="export-row">
      <button class="btn-action" style="flex:1;" onclick="exportSingbox()">导出 Sing-box (.json)</button>
      <button class="btn-action" style="flex:1;" onclick="viewConfig()">查看完整配置</button>
    </div>
  </div>

  <script>
    let generatedConfigStr = "";

    async function onGenerate() {
      const box = document.getElementById('progressBox');
      const bar = document.getElementById('progressBar');
      const label = document.getElementById('statusLabel');
      const pct = document.getElementById('percentLabel');
      const out = document.getElementById('outputSection');

      box.style.display = 'block';
      out.style.display = 'none';

      bar.style.width = '25%';
      pct.innerText = '25%';
      label.innerText = '正在并发并发探测大陆可用低延迟 Anycast IP...';

      setTimeout(async () => {
        bar.style.width = '70%';
        pct.innerText = '70%';
        label.innerText = '正在向 Cloudflare 申请外层与内层双重 WARP 凭证...';

        const proto = document.querySelector('input[name="proto"]:checked').value;
        const count = parseInt(document.getElementById('epCount').value) || 10;

        try {
          let res;
          if (window.go && window.go.main && window.go.main.App) {
            res = await window.go.main.App.GenerateConfig(proto, count);
          } else {
            // 离线模拟数据支持
            res = {
              subUrl: "http://127.0.0.1:8888/sub",
              singboxConfig: JSON.stringify({
                outbounds: [
                  { type: "wireguard", tag: "warp-inner", detour: "warp-outer" },
                  { type: proto === 'awg' ? 'amneziawg' : 'tuic', tag: "warp-outer" }
                ]
              }, null, 2),
              bestEndpoint: "162.159.193.10:2408 (45ms)"
            };
          }

          generatedConfigStr = res.singboxConfig;
          bar.style.width = '100%';
          pct.innerText = '100%';
          label.innerText = '配置生成成功！最优端点: ' + (res.bestEndpoint || '已就绪');
          out.style.display = 'block';
          document.getElementById('subUrl').value = res.subUrl;
        } catch (e) {
          label.innerText = '生成遇到错误: ' + e;
        }
      }, 1000);
    }

    function copySub() {
      const el = document.getElementById('subUrl');
      el.select();
      navigator.clipboard.writeText(el.value);
      alert('已复制本地订阅链接: ' + el.value);
    }

    function exportSingbox() {
      if (!generatedConfigStr) return;
      const blob = new Blob([generatedConfigStr], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'warp_chain_singbox.json';
      a.click();
    }

    function viewConfig() {
      if (!generatedConfigStr) return;
      const w = window.open("", "_blank");
      w.document.write("<pre style='background:#111;color:#0f0;padding:16px;'>" + generatedConfigStr + "</pre>");
    }

    function toggleLang() {
      alert("Language toggle: Default is Simplified Chinese. English localization initialized.");
    }
  </script>
</body>
</html>
